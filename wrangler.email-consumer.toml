name = "sa-bpo-calculator-email-consumer"
main = "workers/calculator-email-consumer.ts"
compatibility_date = "2026-10-27"

[[d1_databases]]
binding = "DB"
database_name = "sa-bpo-calculator"
database_id = "b438ac63-95a4-4110-922a-a64ac70dff66"
migrations_dir = "migrations"

[[queues.consumers]]
queue = "sa-bpo-calculator-emails"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5

[triggers]
# Cloudflare Cron uses UTC; 21:00 UTC is 23:00 SAST.
crons = ["0 21 * * *"]

[vars]
# RESEND_API_KEY must be configured as an encrypted Worker secret, not here.
